name: DESGUAZALO CI

on:
  push:
    branches:
      - main
      - goal/desguazalo-mvp
    paths:
      - "DESGUAZALO/**"
      - ".github/workflows/desguazalo-ci.yml"
  pull_request:
    paths:
      - "DESGUAZALO/**"
      - ".github/workflows/desguazalo-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DESGUAZALO
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: |
          npx eslint . --rule "react-hooks/set-state-in-effect: warn"
      - name: Typecheck, tests and production build
        run: npm run typecheck && npm test && npm run build
